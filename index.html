<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PeakForm Fitness</title>
<style>
body{font-family:Arial;background:#101820;color:white;margin:0;padding:18px}
h1{color:#42e6b5}
.card{background:#202d38;padding:18px;border-radius:15px;margin:15px 0}
input,select,button{padding:12px;margin:5px 0;width:100%;box-sizing:border-box;border-radius:8px}
button{background:#42e6b5;border:0;font-weight:bold}
input,select{background:#fff;color:#111}
small{color:#b5c3cb}
</style>
</head>
<body>
<h1>🏔️ PeakForm</h1>
<p>Three Peaks + Wedding Fitness Tracker</p>
<div class="card">
<h2>🎯 Your Goals</h2>
<p>🏔️ Three Peaks: 20 May 2027</p>
<p>💍 Wedding: 26 June 2027</p>
<p>⚖️ Target weight: 71 kg</p>
</div>
<div class="card">
<h2>💪 Log Workout</h2>
<input id="date" type="date">
<select id="type">
<option>Strength</option>
<option>Incline Walk</option>
<option>Boxing</option>
<option>Hiking</option>
<option>Other</option>
</select>
<input id="details" placeholder="Exercise, sets, reps, weight, distance...">
<input id="duration" type="number" placeholder="Duration (minutes)">
<button onclick="saveWorkout()">Save Workout</button>
</div>
<div class="card">
<h2>❤️ Health Stats</h2>
<input id="weight" type="number" step="0.1" placeholder="Weight (kg)">
<input id="waist" type="number" step="0.1" placeholder="Waist (cm)">
<input id="hr" type="number" placeholder="Average heart rate">
<input id="vo2" type="number" step="0.1" placeholder="VO₂ max">
<button onclick="saveHealth()">Save Health Stats</button>
</div>
<div class="card">
<h2>📊 Workout History</h2>
<div id="history"></div>
</div>
<div class="card">
<h2>📈 Latest Health Stats</h2>
<div id="healthHistory"></div>
</div>
<div class="card">
<h2>💾 Backup</h2>
<button onclick="backup()">Export My Data</button>
<small>Data is stored in this browser. Export regularly.</small>
</div>
<script>
const KEY="peakform_data";
let data;
try{
data=JSON.parse(localStorage.getItem(KEY))||{workouts:[],health:[]};
}catch(e){data={workouts:[],health:[]}}
document.getElementById("date").valueAsDate=new Date();
function persist(){
try{localStorage.setItem(KEY,JSON.stringify(data))}
catch(e){alert("Unable to save. Check browser storage.")}
}
function saveWorkout(){
let d=document.getElementById("date").value;
let t=document.getElementById("type").value;
let x=document.getElementById("details").value.trim();
let m=document.getElementById("duration").value;
if(!d||!x){alert("Enter a date and workout details");return}
data.workouts.push({date:d,type:t,details:x,duration:m});
persist();render();
document.getElementById("details").value="";
document.getElementById("duration").value="";
}
function saveHealth(){
let entry={date:new Date().toISOString().slice(0,10)};
for(let id of ["weight","waist","hr","vo2"]){
let v=document.getElementById(id).value;
if(v!=="")entry[id]=Number(v);
}
if(Object.keys(entry).length===1){
alert("Enter at least one measurement");return
}
data.health.push(entry);persist();render();
}
function render(){
let h=document.getElementById("history");
h.replaceChildren();
data.workouts.slice().reverse().forEach(w=>{
let p=document.createElement("p");
p.textContent=w.date+" | "+w.type+" | "+w.details+
(w.duration?" | "+w.duration+" min":"");
h.appendChild(p);
});
let s=document.getElementById("healthHistory");
s.replaceChildren();
data.health.slice(-5).reverse().forEach(v=>{
let p=document.createElement("p");
p.textContent=Object.entries(v).map(([k,x])=>k+": "+x).join(" | ");
s.appendChild(p);
});
}
function backup(){
let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="peakform-backup.json";
a.click();
setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
render();
</script>
</body>
</html>
